<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обновления · МАЯК</title>
<meta name="description" content="Что нового в играх МАЯКа: все версии, добавления и исправления.">
<meta name="theme-color" content="#14161b">
<link rel="icon" href="../img/dota3-icon.png">
<link rel="stylesheet" href="../style.css?v=04c3e477">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="../" id="logo">
      <svg viewBox="0 0 30 30" aria-hidden="true"><circle class="l-glow" cx="15" cy="7" r="6" opacity=".25"/><rect class="l-lamp" x="12" y="5" width="6" height="4" rx="1"/><path class="l-body" d="M11 10h8l2 17H9z"/><path class="l-stripe" d="M10.4 15h9.2l.5 4h-10.2zM9.7 22h10.6l.4 3H9.3z"/></svg>
      <span class="brand-name">МАЯК</span> <small>игры в браузере</small>
    </a>
    <nav class="nav">
      <a href="../#games">Игры</a>
      <a href="./" class="on">Обновления</a>
      <a href="../music/">Музыка</a>
      <a href="../#about">О сайте</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="game-head">
    <div class="crumbs"><a href="../">Главная</a> / Обновления</div>
    <h1>Обновления</h1>
    <p class="sub">Что добавили и что исправили в каждой игре — новые сверху.</p>
  </div>
  <div class="chips upd-chips" id="feedChips"></div>
  <div class="feed" id="feed"></div>
  <button class="btn btn-small feed-more" id="feedMore" type="button" hidden>Показать ещё</button>
</div>

<footer>
  <div class="wrap">
    <span>© 2026 МАЯК</span>
    <span>Игры на <a href="https://godotengine.org" target="_blank" rel="noopener">Godot Engine</a></span>
  </div>
</footer>

<script src="../theme.js?v=9ae4fc1c"></script>
<script src="../updates.js?v=b0555e1a"></script>
<script>
(function () {
  document.getElementById("logo").addEventListener("click", function () { MayakTheme.remember(""); });
  var UPD = window.MAYAK_UPDATES || [], GAMES = window.MAYAK_GAMES || {};
  var COLORS = { site: "var(--accent)", turniket: "#e8e3d6", metro: "#e2412f", golf: "#ffd23f", arsenal: "#e9b44c",
    kot: "#f5b061", mazomus: "#ff8fb0", budka: "#ffd98a", dota: "#9fb3ff" };
  var MONTHS = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
  var feed = document.getElementById("feed"), chips = document.getElementById("feedChips"), more = document.getElementById("feedMore");
  var game = "", limit = 15, now = Date.now();

  function visible(g) {
    var x = GAMES[g]; if (!x) return false;
    if (!x.secret) return true;
    try { return localStorage.getItem(x.secret) === "1"; } catch (e) { return false; }
  }
  function name(g) { return (GAMES[g] && GAMES[g].name) || g; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]; }); }
  function chip(label, on, fn) {
    var b = document.createElement("button"); b.type = "button"; b.className = "chip" + (on ? " on" : "");
    b.textContent = label; b.addEventListener("click", fn); return b;
  }
  function render() {
    var list = UPD.filter(function (u) { return visible(u.g); });
    chips.innerHTML = "";
    var seen = [];
    list.forEach(function (u) { if (seen.indexOf(u.g) < 0) seen.push(u.g); });
    chips.appendChild(chip("Всё", !game, function () { game = ""; limit = 15; render(); }));
    seen.forEach(function (g) {
      var on = game === g;
      chips.appendChild(chip(name(g), on, function () { game = on ? "" : g; limit = 15; render(); }));
    });
    var rows = list.filter(function (u) { return !game || u.g === game; });
    feed.innerHTML = "";
    rows.slice(0, limit).forEach(function (u) {
      var d = new Date(u.d + "T12:00:00"), x = GAMES[u.g] || {};
      var nm = esc(name(u.g));
      var title = x.href ? '<a href="../' + esc(x.href) + '">' + nm + "</a>" : nm;
      var ver = u.v ? ' <span class="v">' + esc(u.v) + "</span>" : "";
      var sub = u.n ? (u.g === "site" ? ' <span class="nm">' + esc(u.n) + "</span>" : ' <span class="nm">«' + esc(u.n) + "»</span>")
                    : (u.g === "site" ? "" : ' <span class="nm fix">исправления</span>');
      var fresh = now - d.getTime() < 3 * 864e5 ? '<span class="fresh">новое</span>' : "";
      var el = document.createElement("article");
      el.className = "upd";
      el.innerHTML = '<div class="u-date"><b>' + d.getDate() + "</b>" + MONTHS[d.getMonth()] + "</div>" +
        '<div class="u-body"><div class="u-head"><i class="dot" style="background:' + (COLORS[u.g] || "var(--accent)") + '"></i>' +
        title + ver + sub + fresh + "</div><ul>" + (u.i || []).map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul></div>";
      feed.appendChild(el);
    });
    more.hidden = rows.length <= limit;
    more.textContent = "Показать ещё (" + (rows.length - limit) + ")";
  }
  more.addEventListener("click", function () { limit += 20; render(); });
  render();
})();
</script>
</body>
</html>
