<script>
'use strict';
const VERSION='v0.2', UPDATE='Осколки и Ядро';
const W=1280,H=720,TAU=Math.PI*2;
const FD='"Unbounded","Arial Black",system-ui,sans-serif', FB='"Golos Text",system-ui,sans-serif';
const COL={player:'#3ef0ff',haz:'#ff2e88',ink:'#f3f0ff',dim:'#8d86b8',gold:'#ffd75e',void:'#05040b'};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const frac=x=>x-Math.floor(x), clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let scale=1,offX=0,offY=0,dpr=1;
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);const w=cv.clientWidth,h=cv.clientHeight;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);scale=Math.min(w/W,h/H);offX=(w-W*scale)/2;offY=(h-H*scale)/2;}
addEventListener('resize',resize);resize();
try{if(document.fonts) ['800 20px Unbounded','900 20px Unbounded','400 20px "Golos Text"','600 20px "Golos Text"'].forEach(f=>document.fonts.load(f).catch(()=>{}));}catch(e){}

/* ================= AUDIO ================= */
let AC=null,comp,masterG,revIn,dlyIn,dlyNode,noiseBuf,sfxG;
const mf=m=>440*Math.pow(2,(m-69)/12);
function initAudio(ctx){
  if(AC&&!ctx) return;
  AC=ctx||new (window.AudioContext||window.webkitAudioContext)();
  comp=AC.createDynamicsCompressor();comp.threshold.value=-12;comp.knee.value=8;comp.ratio.value=5;comp.attack.value=0.002;comp.release.value=0.18;
  masterG=AC.createGain();masterG.gain.value=0.85;comp.connect(masterG).connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const conv=AC.createConvolver();const len=AC.sampleRate*2.6,ib=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
  conv.buffer=ib;revIn=AC.createGain();const rv=AC.createGain();rv.gain.value=0.3;revIn.connect(conv);conv.connect(rv);rv.connect(comp);
  dlyNode=AC.createDelay(2);dlyIn=AC.createGain();const fb=AC.createGain();fb.gain.value=0.36;const dlp=AC.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=2600;
  dlyIn.connect(dlyNode);dlyNode.connect(dlp);dlp.connect(fb);fb.connect(dlyNode);const dv=AC.createGain();dv.gain.value=0.26;dlp.connect(dv);dv.connect(comp);
  sfxG=AC.createGain();sfxG.gain.value=0.55;sfxG.connect(comp);
}
function makeBus(lpF){
  const out=AC.createGain();out.gain.value=0.9;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=lpF;lp.Q.value=0.7;lp.connect(out);out.connect(comp);
  const duck=AC.createGain();duck.connect(lp);const dry=AC.createGain();dry.connect(lp);
  const rev=AC.createGain();rev.connect(revIn);const dly=AC.createGain();dly.connect(dlyIn);
  return {out,lp,duck,dry,rev,dly};
}
function killBus(b,fade){
  const t=AC.currentTime;for(const g of [b.out.gain,b.rev.gain,b.dly.gain]){g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(0,t+fade);}
  setTimeout(()=>{try{b.out.disconnect();b.rev.disconnect();b.dly.disconnect();}catch(e){}},fade*1000+500);
}
function nz(t,dur){const s=AC.createBufferSource();s.buffer=noiseBuf;s.start(t,Math.random()*1.4);s.stop(t+dur);return s;}
function gEnv(t,peak,a,dec){const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);return g;}
function filt(type,f,q){const n=AC.createBiquadFilter();n.type=type;n.frequency.value=f;if(q!==undefined)n.Q.value=q;return n;}
function send(node,dest,amt){const s=AC.createGain();s.gain.value=amt;node.connect(s);s.connect(dest);}
function osc(type,f,t,dur){const o=AC.createOscillator();o.type=type;o.frequency.value=f;o.start(t);o.stop(t+dur);return o;}

function kick(b,t,v){
  const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(50,t+0.09);o.frequency.exponentialRampToValueAtTime(38,t+0.4);
  const g=gEnv(t,v*1.1,0.003,0.42);o.connect(g).connect(b.dry);o.start(t);o.stop(t+0.5);
  const c=nz(t,0.03),cg=gEnv(t,v*0.22,0.001,0.015);c.connect(filt('highpass',2500)).connect(cg).connect(b.dry);
  const dg=b.duck.gain;dg.cancelScheduledValues(t);dg.setValueAtTime(0.15,t);dg.linearRampToValueAtTime(1,t+0.24);
}
function snare(b,t,v){
  const n=nz(t,0.25),g=gEnv(t,v*0.7,0.002,0.18);n.connect(filt('bandpass',1900,0.6)).connect(g);g.connect(b.dry);send(g,b.rev,0.35);
  const o=AC.createOscillator();o.type='triangle';o.frequency.setValueAtTime(230,t);o.frequency.exponentialRampToValueAtTime(140,t+0.08);const og=gEnv(t,v*0.45,0.002,0.09);o.connect(og).connect(b.dry);o.start(t);o.stop(t+0.15);
}
function clap(b,t,v){
  const n=nz(t,0.3),g=AC.createGain();g.gain.setValueAtTime(0.0001,t);
  [0,0.011,0.022].forEach(d=>{g.gain.setValueAtTime(v*0.8,t+d);g.gain.exponentialRampToValueAtTime(v*0.15,t+d+0.009);});
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);n.connect(filt('bandpass',1350,1.1)).connect(g);g.connect(b.dry);send(g,b.rev,0.4);
}
function hat(b,t,v,open){const n=nz(t,open?0.35:0.06),g=gEnv(t,v*0.32,0.001,open?0.26:0.035);n.connect(filt('highpass',7600)).connect(g).connect(b.dry);}
function crash(b,t,v){const n=nz(t,2),g=gEnv(t,v*0.38,0.002,1.8);n.connect(filt('highpass',3500)).connect(g);g.connect(b.dry);send(g,b.rev,0.5);}
function impact(b,t,v){
  const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(28,t+1.2);const g=gEnv(t,v*0.9,0.004,1.4);o.connect(g).connect(b.dry);o.start(t);o.stop(t+1.5);
  crash(b,t,v*0.8);
}
function riser(b,t,dur,v){
  const n=nz(t,dur+0.05),f=filt('bandpass',300,4);f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(7500,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v*0.32,t+dur);g.gain.linearRampToValueAtTime(0,t+dur+0.04);
  n.connect(f).connect(g);g.connect(b.dry);send(g,b.rev,0.5);
}
function bass(b,t,m,dur,v,kind){
  const reese=kind==='reese',base=reese?260:190,f=filt('lowpass',base*6,reese?3:6);
  f.frequency.setValueAtTime(base*6,t);f.frequency.exponentialRampToValueAtTime(base,t+Math.min(dur,0.25));
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v*0.5,t+0.006);g.gain.setValueAtTime(v*0.5,t+dur*0.85);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  (reese?[-14,0,14]:[-6,6]).forEach(c=>{const o=osc('sawtooth',mf(m),t,dur+0.02);o.detune.value=c;o.connect(f);});
  const sub=osc('sine',mf(m),t,dur+0.02),sg=AC.createGain();sg.gain.value=0.7;sub.connect(sg).connect(g);
  f.connect(g);g.connect(b.duck);
}
function pad(b,t,notes,dur,v){
  const f=filt('lowpass',1400,0.5),g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+Math.min(0.35,dur*0.3));g.gain.setValueAtTime(v,t+dur*0.8);g.gain.linearRampToValueAtTime(0.0001,t+dur+0.4);
  notes.forEach(m=>[-10,10].forEach(c=>{const o=osc('sawtooth',mf(m),t,dur+0.45);o.detune.value=c;o.connect(f);}));
  f.connect(g);g.connect(b.duck);send(g,b.rev,0.6);
}
function lead(b,t,m,dur,v,kind){
  const f=filt('lowpass',5000,2);f.frequency.setValueAtTime(5200,t);f.frequency.exponentialRampToValueAtTime(2300,t+0.2);
  const g=AC.createGain(),dEnd=t+Math.min(0.1,dur*0.6);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.006);g.gain.exponentialRampToValueAtTime(v*0.7,dEnd);g.gain.setValueAtTime(v*0.7,t+dur);g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.09);
  const lfo=osc('sine',5.5,t,dur+0.12),lg=AC.createGain();lg.gain.value=dur>0.3?9:0;lfo.connect(lg);
  const parts=kind==='saw3'?[['sawtooth',-12],['sawtooth',0],['sawtooth',12]]:[['square',0],['sawtooth',7]];
  parts.forEach(([ty,dt])=>{const o=osc(ty,mf(m),t,dur+0.12);o.detune.value=dt;lg.connect(o.detune);const og=AC.createGain();og.gain.value=ty==='square'?0.6:1;o.connect(og).connect(f);});
  f.connect(g);g.connect(b.dry);send(g,b.dly,0.35);send(g,b.rev,0.3);
}
function pluck(b,t,m,v,cut){
  const o=osc('sawtooth',mf(m),t,0.3),f=filt('lowpass',cut,4);f.frequency.setValueAtTime(cut,t);f.frequency.exponentialRampToValueAtTime(Math.max(80,cut*0.15),t+0.18);
  const g=gEnv(t,v,0.003,0.22);o.connect(f).connect(g);g.connect(b.duck);send(g,b.dly,0.4);
}
function bell(b,t,m,v){
  const g=gEnv(t,v,0.002,1.5);const o1=osc('sine',mf(m),t,1.6),o2=osc('sine',mf(m)*2.76,t,0.8),g2=gEnv(t,0.35,0.002,0.5);
  o1.connect(g);o2.connect(g2).connect(g);g.connect(b.dry);send(g,b.rev,0.6);send(g,b.dly,0.3);
}
function sfx(kind){
  if(!AC) return;const t=AC.currentTime+0.005;
  if(kind==='dash'){const n=nz(t,0.16),f=filt('bandpass',3000,1.5);f.frequency.setValueAtTime(3200,t);f.frequency.exponentialRampToValueAtTime(500,t+0.14);const g=gEnv(t,0.35,0.004,0.13);n.connect(f).connect(g).connect(sfxG);}
  if(kind==='hit'){const o=AC.createOscillator();o.type='square';o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(40,t+0.25);const g=gEnv(t,0.45,0.002,0.3);o.connect(filt('lowpass',1300)).connect(g).connect(sfxG);o.start(t);o.stop(t+0.35);
    const n=nz(t,0.2),ng=gEnv(t,0.4,0.002,0.14);n.connect(ng).connect(sfxG);}
  if(kind==='ui'){const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(1320,t+0.05);const g=gEnv(t,0.18,0.002,0.08);o.connect(g).connect(sfxG);o.start(t);o.stop(t+0.12);}
  if(kind==='cp'){[1046,1568].forEach((f,i)=>{const o=osc('sine',f,t+i*0.08,0.6),g=gEnv(t+i*0.08,0.22,0.004,0.5);o.connect(g);g.connect(sfxG);send(g,revIn,0.4);});}
}

/* ---------- Songs (written note by note, scheduled live) ---------- */
const S1={bpm:128,bars:21,
  sec:bar=>bar<4?0:bar<8?1:bar<16?2:bar<20?3:4, energy:[.3,.6,1,1,.3],
  ch:[{r:33,p:[57,60,64]},{r:29,p:[57,60,65]},{r:36,p:[55,60,64]},{r:31,p:[55,59,62]}],
  lead:[
    [[0,69,2],[3,72,1],[4,76,2],[6,74,2],[8,72,2],[10,69,2],[12,67,2],[14,69,2]],
    [[0,69,2],[2,72,2],[4,77,4],[8,76,2],[10,72,2],[12,69,4]],
    [[0,67,2],[2,72,2],[4,76,2],[6,79,2],[8,76,2],[10,72,2],[12,76,2],[14,74,2]],
    [[0,74,4],[4,71,2],[6,67,2],[8,71,2],[10,74,2],[12,76,4]],
    [[0,69,2],[3,72,1],[4,76,2],[6,74,2],[8,72,2],[10,69,2],[12,67,2],[14,69,2]],
    [[0,69,2],[2,72,2],[4,77,4],[8,76,2],[10,77,2],[12,81,4]],
    [[0,79,2],[2,76,2],[4,72,2],[6,76,2],[8,79,4],[12,76,2],[14,74,2]],
    [[0,74,2],[2,76,2],[4,79,4],[8,81,8]]
  ],
  sched(b,bar,s,t,sd,menu){
    const sec=menu?1:this.sec(bar),c=this.ch[bar%4],q=s%4;
    if(sec===4){if(bar===20&&s===0){impact(b,t,0.9);pad(b,t,[57,60,64,69],sd*28,0.07);bass(b,t,33,sd*20,0.4);lead(b,t,81,sd*12,0.1,'sq');}return;}
    if(s===0) pad(b,t,c.p,sd*16,sec===0?0.06:0.045);
    if(sec>=1&&q===0) kick(b,t,1);
    if(sec===0&&bar>=2&&s===0) kick(b,t,0.7);
    if(sec>=2&&(s===4||s===12)) clap(b,t,0.9);
    if(sec===1&&bar>=6&&(s===4||s===12)) snare(b,t,0.45);
    if(!menu&&bar===7&&s>=8) snare(b,t,0.2+0.07*(s-8));
    if(!menu&&bar===15&&s>=8&&s%2===0) snare(b,t,0.3+0.08*(s-8));
    if(q===2) hat(b,t,sec===0?0.25:0.5,sec>=2);
    if(sec>=2&&q!==2) hat(b,t,0.18,false);
    if(sec===0&&s%2===1) hat(b,t,0.08+0.04*bar,false);
    if(sec===1&&q===2) bass(b,t,c.r+12,sd*1.6,0.4);
    if(sec>=2) bass(b,t,c.r+(q===2?12:0),sd*0.9,q===0?0.42:0.32);
    const ap=[c.p[0]+12,c.p[1]+12,c.p[2]+12,c.p[1]+12];
    if(sec<=1||s%2===0){const cut=sec===0?500+((bar*16+s)/64)*2500:sec===1?2600:3400;pluck(b,t,ap[s%4]+(sec===3&&s%8>=4?12:0),sec===0?0.12:0.1,cut);}
    if(sec>=2){for(const n of this.lead[(bar-8)%8]) if(n[0]===s) lead(b,t,n[1],n[2]*sd,0.12,'sq');}
    if(!menu){
      if((bar===6||bar===14)&&s===0) riser(b,t,sd*32,1);
      if((bar===8||bar===16)&&s===0) impact(b,t,0.5);
      if(bar===12&&s===0) crash(b,t,0.35);
    }
  }
};
const S2={bpm:140,bars:37,
  sec:bar=>bar<4?0:bar<12?1:bar<16?2:bar<28?3:bar<32?4:bar<36?5:6, energy:[.3,.6,.55,1,.2,1,.3],
  ch:[{r:38,p:[62,65,69]},{r:34,p:[62,65,70]},{r:31,p:[62,67,70]},{r:33,p:[61,64,69]}],
  lead:[
    [[0,69,2],[2,74,2],[4,77,3],[7,76,1],[8,74,2],[10,69,2],[12,74,4]],
    [[0,77,2],[2,74,2],[4,70,3],[7,74,1],[8,77,4],[12,79,2],[14,77,2]],
    [[0,79,3],[3,77,1],[4,74,4],[8,70,2],[10,74,2],[12,67,4]],
    [[0,76,2],[2,73,2],[4,69,4],[8,76,2],[10,79,2],[12,76,2],[14,81,2]]
  ],
  sched(b,bar,s,t,sd){
    const sec=this.sec(bar),c=this.ch[bar%4],q=s%4;
    if(sec===6){if(bar===36&&s===0){impact(b,t,1);pad(b,t,[62,65,69,74],sd*28,0.07);bass(b,t,38,sd*20,0.35,'reese');lead(b,t,74,sd*14,0.1,'saw3');}return;}
    if(s===0) pad(b,t,c.p,sd*16,(sec===0||sec===4)?0.065:0.04);
    if(sec===1){if(s===0||s===10) kick(b,t,1);if(s===4||s===12) snare(b,t,0.7);if(s===7||s===15) snare(b,t,0.15);if(s%2===0) hat(b,t,0.35,false);}
    if(sec===2){if(q===0) kick(b,t,0.9);if(s%2===0) hat(b,t,0.3,false);
      if(bar<14){if(s===4||s===12) snare(b,t,0.5);} else if(bar===14){if(s%2===0) snare(b,t,0.25+s*0.012);} else snare(b,t,0.3+s*0.03);}
    if(sec===3||sec===5){if(q===0||s===14) kick(b,t,1);if(s===4||s===12){clap(b,t,0.8);snare(b,t,0.35);}hat(b,t,q===2?0.5:0.2,q===2);}
    if(sec===4&&bar===31&&s%2===0) snare(b,t,0.15+s*0.03);
    if(sec===1&&(s===0||s===8)) bass(b,t,c.r,sd*7,0.32,'reese');
    if(sec===2&&q===0) bass(b,t,c.r,sd*3,0.3,'reese');
    if(sec===3||sec===5){const pat={0:0,3:12,6:0,8:0,10:12,11:0,14:12};if(pat[s]!==undefined) bass(b,t,c.r+pat[s],sd*1.8,0.34,'reese');}
    const ap=[0,1,2,1,0,2,1,2].map(i=>c.p[i]+12);
    if(sec===0) pluck(b,t,ap[s%8],0.11,600+((bar*16+s)/64)*2600);
    if(sec===1&&s%2===0) pluck(b,t,ap[(s/2)%8],0.09,2200);
    if(sec===2) pluck(b,t,ap[s%8],0.09,1500+((bar-12)*16+s)*40);
    if((sec===3||sec===5)&&s%2===1) pluck(b,t,ap[s%8]+12,0.06,3000);

function hitPrim(p,px,py,pr){

  if(p.k===4) return Math.hypot(px-p.x,py-p.y)<p.r*(p.shape==='star'?0.6:0.85)+pr;
  if(p.k===5) return Math.hypot(px-p.x,py-p.y)<p.r*0.6+pr;

}

  else if(e.t==='fx'){if(e.kind==='boom'){shake=26;flash=0.9;flashCol='255,255,255';sparks(e.x,e.y,90,COL.haz,700,true);}else{flash=0.5;flashCol='255,255,255';shake=12;}}
}
function rankOf(){return G.deaths===0&&G.hits===0?'S':G.deaths===0&&G.hits<=2?'A':G.deaths===0?'B':'C';}
function finish(){
  G.done=true;G.rank=rankOf();const prev=best[G.L.id];
  if(!prev||'SABC'.indexOf(G.rank)<'SABC'.indexOf(prev)){best[G.L.id]=G.rank;saveBest();}
  G.resT=0;scene='result';sel=0;
}
function toMenuMusic(){musicStart('s1',0,{menu:true,lp:1300});}
function pauseGame(){if(scene!=='play'||G.done||G.rewind>0) return;scene='pause';sel=0;if(AC) AC.suspend();}
function resumeGame(){scene='play';if(AC) AC.resume();}
function toggleFS(){try{if(!document.fullscreenElement){const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();r&&r.catch&&r.catch(()=>{});}else document.exitFullscreen&&document.exitFullscreen();}catch(e){}}
function boot(){if(scene!=='splash') return;initAudio();if(AC.state!=='running') AC.resume();toMenuMusic();scene='title';sel=0;}

/* ================= INPUT ================= */
const MOVE={KeyW:[0,-1],ArrowUp:[0,-1],KeyS:[0,1],ArrowDown:[0,1],KeyA:[-1,0],ArrowLeft:[-1,0],KeyD:[1,0],ArrowRight:[1,0]};
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  keys[e.code]=true;mouse.active=false;
  if(scene==='splash'){boot();return;}
  if(e.code==='KeyF'&&!e.repeat){toggleFS();return;}
  if(scene==='play'){
    if((e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyK')&&!e.repeat) P.want=true;
    if(e.code==='Escape'||e.code==='KeyP') pauseGame();
    return;
  }
  if(scene==='pause'&&(e.code==='Escape'||e.code==='KeyP')){resumeGame();return;}
  if(scene==='map'){
    if(e.code==='ArrowLeft'||e.code==='KeyA'){mapSel=(mapSel+LEVELS.length-1)%LEVELS.length;sfx('ui');return;}
    if(e.code==='ArrowRight'||e.code==='KeyD'){mapSel=(mapSel+1)%LEVELS.length;sfx('ui');return;}
    if(e.code==='Escape'){scene='title';sel=0;sfx('ui');return;}
    if(e.code==='Enter'||e.code==='Space'){playSel();return;}
    return;
  }
  if(btns.length){
    if(e.code==='ArrowDown'||e.code==='KeyS'){sel=(sel+1)%btns.length;sfx('ui');}
    if(e.code==='ArrowUp'||e.code==='KeyW'){sel=(sel+btns.length-1)%btns.length;sfx('ui');}
    if(e.code==='Enter'||e.code==='Space'){const b=btns[sel];if(b){sfx('ui');b.act();}}
  }
});
addEventListener('keyup',e=>{keys[e.code]=false;});
function toLogical(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left-offX)/scale,y:(e.clientY-r.top-offY)/scale};}
cv.addEventListener('pointermove',e=>{const p=toLogical(e);mouse.x=p.x;mouse.y=p.y;if(e.pointerType==='mouse') mouse.active=true;
  if(joy&&e.pointerId===joy.id){const dx=p.x-joy.ox,dy=p.y-joy.oy,d=Math.hypot(dx,dy),m=Math.min(d,70);joy.dx=d>4?dx/d*m/70:0;joy.dy=d>4?dy/d*m/70:0;}});
cv.addEventListener('pointerdown',e=>{
  cv.focus();const p=toLogical(e);mouse.x=p.x;mouse.y=p.y;
  if(scene==='splash'){boot();return;}
  if(scene==='play'&&e.pointerType!=='mouse'){
    if(p.x>W-120&&p.y<90){pauseGame();return;}
    if(p.x<W*0.6) joy={id:e.pointerId,ox:p.x,oy:p.y,dx:0,dy:0}; else P.want=true;return;
  }
  if(scene==='map'){for(let i=0;i<LEVELS.length;i++){const n=nodePos(i);if(Math.hypot(p.x-n.x,p.y-n.y)<56){if(mapSel===i) playSel();else{mapSel=i;sfx('ui');}return;}}}
  for(const b of btns){if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){sfx('ui');b.act();return;}}
});
const endJoy=e=>{if(joy&&e.pointerId===joy.id) joy=null;};
cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
document.addEventListener('visibilitychange',()=>{if(document.hidden) pauseGame();});
function playSel(){const L=LEVELS[mapSel];if(L.locked){sfx('hit');return;}sfx('ui');startLevel(L);}

/* ================= UPDATE ================= */
function updatePlayer(dt){
  let mx=0,my=0;for(const k in MOVE) if(keys[k]){mx+=MOVE[k][0];my+=MOVE[k][1];}
  if(joy){mx+=joy.dx;my+=joy.dy;}
  const m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m;}
  if(m>0.1){P.lx=mx/Math.max(1,m)||P.lx;P.ly=my/Math.max(1,m)||P.ly;const n=Math.hypot(P.lx,P.ly)||1;P.lx/=n;P.ly/=n;}
  P.dashCd-=dt;P.dashI-=dt;P.inv-=dt;
  if(P.want&&P.dashCd<=0){P.dashT=0.14;P.dashI=0.2;P.dashCd=0.38;P.ddx=P.lx;P.ddy=P.ly;sfx('dash');}
  P.want=false;
  if(P.dashT>0){P.dashT-=dt;P.vx=P.ddx*1050;P.vy=P.ddy*1050;P.trail.push({x:P.x,y:P.y,l:0.22,a:Math.atan2(P.ddy,P.ddx)});}
  else{const k=Math.min(1,dt*20);P.vx=lerp(P.vx,mx*340,k);P.vy=lerp(P.vy,my*340,k);}
  P.x=clamp(P.x+P.vx*dt,10,W-10);P.y=clamp(P.y+P.vy*dt,10,H-10);
  P.rot=lerp(P.rot,(P.vx/340)*0.35,Math.min(1,dt*12));
  for(const t of P.trail) t.l-=dt;while(P.trail.length&&P.trail[0].l<=0) P.trail.shift();
}
function update(dt){
  shake=Math.max(0,shake-dt*40);flash=Math.max(0,flash-dt*2.2);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;const f=Math.pow(0.03,dt);p.vx*=f;p.vy*=f;p.life-=dt;p.r+=dt*6;}
  for(let i=parts.length-1;i>=0;i--) if(parts[i].life<=0) parts.splice(i,1);
  if(scene==='play'){
    if(G.rewind>0){G.rewind-=dt;if(G.rewind<=0) spawnAt(G.cp);return;}
    const B=beatNow();G.B=B;updatePlayer(dt);
    G.prims=evalHaz(G.L,B);
    for(const e of G.L.events) if(!e.fired&&B>=e.b){e.fired=true;onFire(e);}
    for(const c of G.L.cps) if(B>=c&&c>G.cp){G.cp=c;G.toast={text:(G.L.cpNames&&G.L.cpNames[c])||'ЧЕКПОИНТ',t:0};sfx('cp');}
    if(G.toast){G.toast.t+=dt;if(G.toast.t>1.6) G.toast=null;}
    if(!window.__god&&P.inv<=0&&P.dashI<=0){for(const p of G.prims) if(p.live&&hitPrim(p,P.x,P.y,7)){hurt();break;}}
    if(B>=G.L.end) finish();
  } else if(scene==='result'){
    G.resT+=dt;G.B=beatNow();G.prims=evalHaz(G.L,G.B);updatePlayer(dt);
  }
}

/* ================= RENDER ================= */
function fontD(px,w){return `${w||800} ${px}px ${FD}`;}
function fontB(px,w){return `${w||400} ${px}px ${FB}`;}
function text(s,x,y,font,col,align,al){ctx.font=font;ctx.fillStyle=col;ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.globalAlpha=al===undefined?1:al;ctx.fillText(s,x,y);ctx.globalAlpha=1;}
function spaced(s,x,y,font,col,sp,align){ctx.font=font;let w=0;for(const ch of s) w+=ctx.measureText(ch).width+sp;w-=sp;let cx0=align==='center'?x-w/2:align==='right'?x-w:x;ctx.fillStyle=col;ctx.textAlign='left';ctx.textBaseline='middle';for(const ch of s){ctx.fillText(ch,cx0,y);cx0+=ctx.measureText(ch).width+sp;}}
function shapePath(kind,x,y,r,rot){
  ctx.beginPath();
  const poly=(n,off)=>{for(let i=0;i<n;i++){const a=rot+off+i*TAU/n;i?ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r):ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();};
  if(kind==='sq') poly(4,Math.PI/4);
  else if(kind==='tri') poly(3,-Math.PI/2);
  else if(kind==='hex') poly(6,0);
  else{for(let i=0;i<10;i++){const a=rot-Math.PI/2+i*TAU/10,rr=i%2?r*0.45:r;i?ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):ctx.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();}
}
function drawBG(B,en,th){
  ctx.fillStyle=th.bg;ctx.fillRect(-80,-80,W+160,H+160);
  const pu=Math.exp(-frac(B)*4)*en;
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle=th.grid;ctx.lineWidth=2;
  for(let i=0;i<4;i++){const s=260+i*190+pu*24;ctx.globalAlpha=0.045+0.06*pu;ctx.save();ctx.translate(W/2,H/2);ctx.rotate(B*0.04*(i%2?1:-1)+i*0.3);ctx.strokeRect(-s/2,-s/2,s,s);ctx.restore();}
  ctx.fillStyle=th.grid;ctx.globalAlpha=0.09+0.2*pu;
  for(let x=40;x<W;x+=80) for(let y=40;y<H;y+=80) ctx.fillRect(x-1.5,y-1.5,3,3);
  ctx.restore();
  const g=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.95);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.55)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function drawPrims(list){
  ctx.save();
  for(let pass=0;pass<2;pass++){
    for(const p of list){
      if((pass===0)===p.live) continue;
      const al=clamp(p.al,0,1);
      if(!p.live){
        ctx.globalAlpha=al;ctx.fillStyle='rgba(255,46,136,0.55)';ctx.strokeStyle=COL.haz;ctx.lineWidth=2;ctx.shadowBlur=0;
        if(p.k===0){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();}
        else if(p.k===1){ctx.globalAlpha=al*0.6;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();ctx.globalAlpha=al;ctx.stroke();}

        else if(p.k===4){ctx.lineWidth=3;shapePath(p.shape||'hex',p.x,p.y,Math.max(1,p.r),p.rot);ctx.stroke();}
        else if(p.k===5){ctx.lineWidth=3;shapePath('tri',p.x,p.y,p.r,p.rot);ctx.stroke();ctx.globalAlpha=al*0.4;ctx.fill();}
        if(p.zone){ctx.globalAlpha=al*1.6;ctx.lineWidth=3;ctx.strokeRect(p.x-p.w/2+2,p.y-p.h/2+2,p.w-4,p.h-4);}

      }
      const fl=p.fl||0,col=fl>0.05?`rgb(255,${Math.round(46+209*fl)},${Math.round(136+119*fl)})`:COL.haz;
      ctx.globalAlpha=al;ctx.fillStyle=col;ctx.strokeStyle=col;
      if(p.bul){ctx.shadowBlur=0;ctx.globalAlpha=al*0.22;ctx.beginPath();ctx.arc(p.x,p.y,p.r*2,0,TAU);ctx.fill();ctx.globalAlpha=al;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();continue;}
      ctx.shadowColor=COL.haz;ctx.shadowBlur=22;
      if(p.k===0){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();}
      else if(p.k===1){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}
      else if(p.k===2){ctx.lineWidth=p.th;ctx.beginPath();p.gw?ctx.arc(p.x,p.y,p.r,p.ga+p.gw/2,p.ga-p.gw/2+TAU):ctx.arc(p.x,p.y,p.r,0,TAU);ctx.stroke();}
      else if(p.k===5){shapePath('tri',p.x,p.y,p.r,p.rot);ctx.fill();}
      else if(p.k===4){
        shapePath(p.shape||'hex',p.x,p.y,p.r,p.rot);ctx.fill();ctx.shadowBlur=0;
        ctx.fillStyle='#2a0716';shapePath('hex',p.x,p.y,p.r*0.58,-p.rot*1.4);ctx.fill();
        ctx.fillStyle=COL.haz;shapePath('tri',p.x,p.y,p.r*0.34*(1+0.3*(p.pu||0)),p.rot*2);ctx.fill();
        ctx.fillStyle='#fff';ctx.globalAlpha=0.5+0.5*(p.pu||0);ctx.beginPath();ctx.arc(p.x,p.y,5+6*(p.pu||0),0,TAU);ctx.fill();
      }
    }
  }
  ctx.restore();
}
function drawParts(){

    else{ctx.beginPath();ctx.arc(p.x,p.y,p.sz/2,0,TAU);ctx.fill();}}

function drawPlayer(B){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const t of P.trail){ctx.globalAlpha=t.l/0.22*0.5;ctx.fillStyle=COL.player;ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.a);ctx.fillRect(-11,-7,22,14);ctx.restore();}

  ctx.shadowColor=COL.player;ctx.shadowBlur=18+8*pu;ctx.fillStyle=COL.player;ctx.fillRect(-9,-9,18,18);
  ctx.shadowBlur=0;ctx.fillStyle='#e9feff';ctx.fillRect(-3.5,-3.5,7,7);

function sceneEnergy(L,B){const S=SONGS[L.song];return S.energy[S.sec(clamp(Math.floor(B/4),0,S.bars-1))];}

  const pu=Math.exp(-frac(B)*6),bi=Math.floor(B)%5;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<14;i++){const a=i/14*TAU+B*0.12,r=300+40*Math.sin(B*0.5+i);const x=W/2+Math.cos(a)*r*1.5,y=250+Math.sin(a)*r*0.55;
    ctx.globalAlpha=0.35+0.4*pu;ctx.fillStyle=COL.haz;ctx.beginPath();ctx.arc(x,y,5+(i%3)*3+pu*3,0,TAU);ctx.fill();}
  ctx.restore();
  const word='ПУЛЬС';ctx.font=fontD(150,900);
  const ws=[...word].map(c=>ctx.measureText(c).width);const gap=12,tw=ws.reduce((a,b)=>a+b,0)+gap*4;let x=W/2-tw/2;
  [...word].forEach((c,i)=>{
    const jump=(i===bi?28:8)*pu,y=235-jump;
    ctx.textAlign='left';ctx.textBaseline='middle';ctx.font=fontD(150,900);
    ctx.globalAlpha=0.85;ctx.fillStyle=COL.haz;ctx.fillText(c,x+5,y+4);
    ctx.fillStyle=COL.player;ctx.fillText(c,x-5,y-4);
    ctx.globalAlpha=1;ctx.fillStyle=COL.ink;ctx.fillText(c,x,y);x+=ws[i]+gap;});
  const px=W/2+Math.cos(B*Math.PI/2)*tw*0.55,py=345+Math.sin(B*Math.PI)*10;
  ctx.save();ctx.translate(px,py);ctx.rotate(B*Math.PI/2);ctx.shadowColor=COL.player;ctx.shadowBlur=16;ctx.fillStyle=COL.player;ctx.fillRect(-9,-9,18,18);ctx.restore();
  text('уворачивайся от ритма',W/2,385,fontB(24,600),COL.dim,'center');
  btns=[];
  button(W/2-150,440,300,60,'ИГРАТЬ',()=>{scene='map';sel=0;},true);
  button(W/2-150,516,300,52,'ПОЛНЫЙ ЭКРАН',toggleFS);
  text(`${VERSION} · обновление «${UPDATE}»`,40,H-34,fontB(15,600),COL.dim,'left');
  text('WASD / стрелки · ПРОБЕЛ — рывок · F — полный экран',W-40,H-34,fontB(15,600),COL.dim,'right');
}
function nodePos(i){return {x:210+i*287,y:[290,240,300,230][i]};}
function renderMap(){
  const B=beatNow(),L=LEVELS[mapSel];drawBG(B,0.6,L.theme);
  spaced('ВЫБОР УРОВНЯ',80,86,fontD(34,800),COL.ink,4,'left');
  text('4 уровня: первые короткие, дальше длиннее. Последний — босс.',80,124,fontB(18,400),COL.dim,'left');
  ctx.lineWidth=3;
  for(let i=0;i<LEVELS.length-1;i++){const a=nodePos(i),b=nodePos(i+1);ctx.strokeStyle=LEVELS[i+1].locked?'rgba(243,240,255,0.18)':'rgba(62,240,255,0.55)';ctx.setLineDash(LEVELS[i+1].locked?[8,10]:[]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  ctx.setLineDash([]);
  const pu=Math.exp(-frac(B)*6);
  LEVELS.forEach((lv,i)=>{
    const n=nodePos(i),s=i===mapSel,r=(s?44:34)+(s?pu*6:0),col=lv.locked?'rgba(243,240,255,0.35)':COL.player;
    ctx.save();
    if(s){ctx.strokeStyle=lv.locked?'rgba(243,240,255,0.3)':'rgba(62,240,255,0.4)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(n.x,n.y,r+20+pu*8,0,TAU);ctx.stroke();}
    if(!lv.locked){ctx.shadowColor=lv.boss?COL.haz:COL.player;ctx.shadowBlur=s?26:10;}
    ctx.fillStyle=lv.locked?'rgba(243,240,255,0.08)':(lv.boss?COL.haz:col);shapePath(lv.shape,n.x,n.y,r,s?B*0.3:0);ctx.fill();
    ctx.shadowBlur=0;if(lv.locked){ctx.strokeStyle=lv.boss?'rgba(255,46,136,0.6)':col;ctx.lineWidth=2;ctx.stroke();}
    ctx.restore();
    text(String(i+1),n.x,n.y+2,fontD(22,900),lv.locked?COL.ink:'#05040b','center',lv.locked?0.6:1);
    text(lv.name,n.x,n.y+r+34,fontB(18,600),s?COL.ink:COL.dim,'center');
    text(lv.locked?'скоро':lv.dur,n.x,n.y+r+58,fontB(15,600),lv.locked?COL.haz:COL.dim,'center',0.85);
    if(best[lv.id]) text(best[lv.id],n.x+r+6,n.y-r,fontD(20,900),COL.gold,'center');
  });
  // info card
  const cy=430,cx0=80,cw=W-160,ch=210;
  ctx.fillStyle='rgba(5,4,11,0.62)';ctx.fillRect(cx0,cy,cw,ch);ctx.strokeStyle='rgba(243,240,255,0.12)';ctx.lineWidth=1;ctx.strokeRect(cx0+0.5,cy+0.5,cw-1,ch-1);
  ctx.fillStyle=L.boss?COL.haz:COL.player;ctx.fillRect(cx0,cy,6,ch);
  text(`УРОВЕНЬ ${mapSel+1}${L.boss?' · БОСС':''}`,cx0+40,cy+40,fontB(15,600),L.boss?COL.haz:COL.player,'left');
  spaced(L.name.toUpperCase(),cx0+40,cy+82,fontD(36,800),COL.ink,3,'left');
  text(L.blurb,cx0+40,cy+126,fontB(18,400),COL.dim,'left');
  text(`${L.dur}  ·  ${L.bpm} BPM`,cx0+40,cy+170,fontB(18,600),COL.ink,'left');
  ctx.font=fontB(18,600);const dx=cx0+40+ctx.measureText(`${L.dur}  ·  ${L.bpm} BPM`).width+30;
  text('сложность',dx,cy+170,fontB(15,600),COL.dim,'left');
  for(let i=0;i<4;i++){ctx.save();ctx.translate(dx+100+i*22,cy+170);ctx.rotate(Math.PI/4);if(i<L.diff){ctx.fillStyle=L.diff>=4?COL.haz:COL.player;ctx.fillRect(-6,-6,12,12);}else{ctx.strokeStyle='rgba(243,240,255,0.3)';ctx.lineWidth=1.5;ctx.strokeRect(-6,-6,12,12);}ctx.restore();}
  if(best[L.id]) text(`лучший ранг: ${best[L.id]}`,dx+220,cy+170,fontB(16,600),COL.gold,'left');
  btns=[];
  if(L.locked){ctx.fillStyle='rgba(255,46,136,0.1)';ctx.fillRect(cx0+cw-300,cy+ch/2-30,260,60);spaced('В РАЗРАБОТКЕ',cx0+cw-170,cy+ch/2,fontD(16,800),COL.haz,3,'center');}
  else button(cx0+cw-300,cy+ch/2-32,260,64,'ИГРАТЬ  ▶',playSel,true);
  text('← → выбрать уровень · Enter — играть · Esc — назад',80,H-34,fontB(15,600),COL.dim,'left');
  text(`${VERSION} · «${UPDATE}»`,W-40,H-34,fontB(15,600),COL.dim,'right');
}
function renderPause(){
  drawWorld(G.L);drawHUD(G.L);
  ctx.fillStyle='rgba(5,4,11,0.72)';ctx.fillRect(0,0,W,H);
  spaced('ПАУЗА',W/2,220,fontD(64,900),COL.ink,8,'center');
  btns=[];
  button(W/2-160,300,320,58,'ПРОДОЛЖИТЬ',resumeGame,true);
  button(W/2-160,372,320,54,'ЗАНОВО',()=>{if(AC) AC.resume();startLevel(G.L);});
  button(W/2-160,440,320,54,'К УРОВНЯМ',()=>{if(AC) AC.resume();scene='map';toMenuMusic();});
}
function renderResult(){
  drawWorld(G.L);
  const t=G.resT,a=Math.min(1,t*2);
  ctx.fillStyle=`rgba(5,4,11,${0.7*a})`;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=a;
  spaced(G.L.boss?'ЯДРО ПОВЕРЖЕНО':'УРОВЕНЬ ПРОЙДЕН',W/2,120,fontD(40,900),G.L.boss?COL.gold:COL.player,6,'center');
  text(G.L.name,W/2,166,fontB(22,600),COL.dim,'center',a);
  const rk=G.rank,rc={S:COL.gold,A:COL.player,B:COL.ink,C:COL.dim}[rk],k=clamp((t-0.4)/0.35,0,1),sc=k<1?2.2-1.2*(1-(1-k)*(1-k)):1+0.04*Math.exp(-frac(beatNow())*5);
  if(t>0.4){ctx.save();ctx.translate(W/2,320);ctx.scale(sc,sc);ctx.globalAlpha=k;ctx.font=fontD(170,900);ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=rc;ctx.shadowBlur=40;ctx.fillStyle=rc;ctx.fillText(rk,0,0);ctx.restore();}
  ctx.globalAlpha=a;
  text('РАНГ',W/2,206,fontB(15,600),COL.dim,'center',a);
  text(`Попадания: ${G.hits}`,W/2-150,460,fontB(22,600),COL.ink,'center',a);
  text(`Перемотки: ${G.deaths}`,W/2+150,460,fontB(22,600),COL.ink,'center',a);
  text('S — без попаданий · A — до 2 попаданий · B — без перемоток · C — с перемотками',W/2,500,fontB(15,400),COL.dim,'center',a);
  ctx.globalAlpha=1;
  btns=[];
  if(t>0.8){
    button(W/2-330,560,300,58,'ЕЩЁ РАЗ',()=>startLevel(G.L),true);
    button(W/2+30,560,300,58,'К УРОВНЯМ',()=>{scene='map';toMenuMusic();});
  }
}
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=COL.void;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*offX,dpr*offY);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.globalAlpha=1;ctx.shadowBlur=0;
  if(scene==='splash') renderSplash();
  else if(scene==='title') renderTitle();
  else if(scene==='map') renderMap();
  else if(scene==='play'){btns=[];drawWorld(G.L);drawHUD(G.L);}
  else if(scene==='pause') renderPause();
  else if(scene==='result') renderResult();
  if(flash>0){ctx.fillStyle=`rgba(${flashCol},${flash*(RM?0.3:0.6)})`;ctx.fillRect(0,0,W,H);}
  ctx.restore();
}
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;T+=dt;musicTick();update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
